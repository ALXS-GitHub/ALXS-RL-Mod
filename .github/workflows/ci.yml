name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - "**.md"
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  checks:
    runs-on: windows-latest
    # bash -e: stop at the first failing command (pwsh only reports the last one).
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: bun install --frozen-lockfile

      - name: Frontend
        run: |
          bun run typecheck
          bun run lint
          bunx vitest run

      # Public builds must not contain the personal edition (MMR / tracker.gg,
      # docs/PERSONAL_EDITION.md).
      - name: Public bundle guard
        run: |
          bun run build
          if grep -rlE "personal://ratings|mmr_lookup|ratings_state|tracker\.(gg|network)" dist; then
            echo "::error::personal edition code found in the public bundle"
            exit 1
          fi

      - name: Backend
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --lib
          # The personal edition must keep compiling (never shipped).
          cargo clippy --all-targets --features personal -- -D warnings
          cargo test --lib --features personal
