name: Release

# Push a tag `vX.Y.Z` (matching the version in src-tauri/tauri.conf.json,
# src-tauri/Cargo.toml and package.json) to build the signed Windows
# installer and a draft GitHub release. Publishing the draft makes the
# installed apps update themselves (they read latest.json from it).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and publish the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bunx tauri
          tagName: v__VERSION__
          releaseName: "ALXS-RL-Mod v__VERSION__"
          releaseBody: |
            Download the **`_x64-setup.exe`** installer below and run it (Windows, Epic Games version of Rocket League).
            Already installed? The app updates itself.

            See the [README](https://github.com/ALXS-GitHub/ALXS-RL-Mod#readme) for keys.txt and the FAQ.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
